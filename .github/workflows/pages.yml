name: Deploy landing site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT instead of the auto GITHUB_TOKEN — the auto-token returns
          # 403 "account suspended" for this account even though browse + push work fine.
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Push docs/ to gh-pages branch
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -R docs/. "$WORK/"
          touch "$WORK/.nojekyll"

          cd "$WORK"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${DEPLOY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f -q origin gh-pages
